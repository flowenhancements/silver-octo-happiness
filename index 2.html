<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaser's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: "Orbitron", system-ui, sans-serif;
}
canvas {
  display: block;
  position: absolute;
  inset: 0;
}
.wrap {
  position: relative;
  z-index: 5;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
}
#title {
  color: #fff;
  font-size: clamp(34px, 7vw, 68px);
  font-weight: 800;
  letter-spacing: 0.12em;
  text-align: center;
  text-shadow:
    0 0 4px #fff,
    0 0 12px rgba(255,255,255,0.7),
    0 0 28px rgba(255,255,255,0.35);
}
#start {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 220px;
  padding: 18px 48px;
  border: 2px solid #fff;
  background: transparent;
  color: #fff;
  font-family: "Orbitron", system-ui, sans-serif;
  font-size: clamp(18px, 3.5vw, 26px);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow:
    0 0 8px rgba(255,255,255,0.45),
    0 0 22px rgba(255,255,255,0.2);
  text-shadow:
    0 0 4px #fff,
    0 0 12px rgba(255,255,255,0.55);
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}
#start::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(255,255,255,0.85);
  pointer-events: none;
}
#start:hover {
  background: rgba(255,255,255,0.06);
  transform: scale(1.04);
  box-shadow:
    0 0 12px rgba(255,255,255,0.65),
    0 0 32px rgba(255,255,255,0.3);
}
#start:active {
  transform: scale(0.98);
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
  <div id="title">yaser’s arcade</div>
  <button id="start" type="button">Start</button>
</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const particles = [];
for (let i = 0; i < 160; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.4 + 0.3,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    a: Math.random() * 0.55 + 0.2
  });
}

function frame() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = w;
    if (p.x > w) p.x = 0;
    if (p.y < 0) p.y = h;
    if (p.y > h) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
    ctx.fill();
  }
  requestAnimationFrame(frame);
}
frame();

const ARCADE_URL = "https://cdn.jsdelivr.net/gh/flowenhancements/studious-octo-dollop@main/index.html";

document.getElementById("start").addEventListener("click", () => {
  window.location.href = ARCADE_URL;
});
</script>
</body>
</html>
